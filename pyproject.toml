[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-prompt"
version = "2.1.1"
description = "Chat-mode forge for persona-layer system prompts, with a live model picker, per-target learning, and any OpenAI-compatible backend."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "textual>=0.60",
    "openai>=1.30",
]

[project.scripts]
forge = "forge_tui:main"
forge-cli = "forge:main"

[tool.setuptools]
py-modules = ["forge", "forge_core", "forge_tui"]
