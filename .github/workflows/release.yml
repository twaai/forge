name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and publish, for example v3.1.0"
        required: true
        default: "v3.1.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            source: dist/Forge-3.1.exe
            asset: Forge-3.1-windows-x64.exe
          - os: ubuntu-latest
            label: linux-x64
            source: dist/Forge-3.1
            asset: Forge-3.1-linux-x64
          - os: macos-latest
            label: macos-arm64
            source: dist/Forge-3.1
            asset: Forge-3.1-macos-arm64
          - os: macos-15-intel
            label: macos-x64
            source: dist/Forge-3.1
            asset: Forge-3.1-macos-x64

    steps:
      - name: Select release ref
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux GUI build libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libglvnd0

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest forge3/tests -q

      - name: Build native application
        run: pyinstaller --clean --noconfirm forge.spec

      - name: Verify frozen Linux GUI backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyi-archive_viewer -l dist/Forge-3.1 | grep -F 'libEGL.so.1'
          pyi-archive_viewer -l dist/Forge-3.1 | grep -F 'libGLdispatch.so.0'
          FORGE_VERIFY_GUI_BACKEND=1 dist/Forge-3.1

      - name: Name release asset
        shell: bash
        run: |
          mv "${{ matrix.source }}" "dist/${{ matrix.asset }}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "dist/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Forge-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "Forge 3.1" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* \
            --repo "${{ github.repository }}" --clobber
